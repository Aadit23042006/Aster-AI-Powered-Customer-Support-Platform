name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aster_row_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aster_row_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aster_row_test
      REDIS_URL: redis://localhost:6379/0
      USE_MOCK_LLM: "1"
      AUTH_SECRET: ci-only-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: |
          ruff check --select=E9,F63,F7,F82 app tests tests_web

      - name: Run database migrations
        run: |
          python -m alembic upgrade head

      - name: Verify Alembic model state
        run: |
          python -m alembic check

      - name: AI/RAG core test suite
        run: |
          python -m pytest tests/ -v

      - name: Web API test suite
        run: |
          python -m pytest tests_web/ -v

      - name: Evaluation harness smoke check
        run: |
          python evaluation/run_eval.py --mock

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependency vulnerability scan
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Frontend dependency vulnerability scan
        continue-on-error: true
        working-directory: frontend
        run: |
          npm audit --audit-level=high

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t aster-row-backend:ci .

      - name: Build frontend image
        run: |
          docker build \
            -t aster-row-frontend:ci \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            frontend

      - name: Validate Docker Compose configuration
        run: |
          docker compose config